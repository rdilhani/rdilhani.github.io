<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    {{ "head.html" | include }}
  </head>
  <body>
    <header>
      <nav>
        <a href="{{ "/" | relative_url }}">{{ site.title }}</a>
      </nav>
    </header>

    <main>
      {{ content }}
    </main>

    <footer>
      <p>&copy; {{ site.author }} {{ site.time | date: "%Y" }}</p>
    </footer>
  </body>
</html>
