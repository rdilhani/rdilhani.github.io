<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css" />
    <style>
      /* Basic site styling for the profile layout */
      :root { --max-width: 980px; --accent:#0a66c2; }
      body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial; margin:0; color:#222; line-height:1.6; }
      header{ background:#fff; border-bottom:1px solid #eee; }
      header .wrap{ max-width:var(--max-width); margin:0 auto; padding:1rem; display:flex; align-items:center; justify-content:space-between; }
      a.brand{ font-weight:700; color:var(--accent); text-decoration:none; }
      main{ max-width:var(--max-width); margin:1.25rem auto; padding:0 1rem; }
      .hero{ text-align:center; padding:2rem 1rem; }
      .hero img{ width:140px; height:140px; border-radius:50%; object-fit:cover; }
      .hero h1{ margin:.5rem 0 0; font-size:1.75rem; }
      .swiper{ margin:1rem 0; }
      .swiper-slide{ position:relative; overflow:hidden; }
      .swiper-slide img{ width:100%; height:360px; object-fit:cover; display:block; }
      .slide-caption{ position:absolute; left:1rem; bottom:1rem; color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.5); }
      section.profile-grid{ display:grid; grid-template-columns: 1fr 2fr; gap:1rem; align-items:start; }
      @media (max-width:720px){ section.profile-grid{ grid-template-columns: 1fr; } }
      footer{ text-align:center; padding:1rem 0; border-top:1px solid #eee; color:#666; }
    </style>
    {{ content_for_head }}
  </head>
  <body>
    <header>
      <div class="wrap">
        <a class="brand" href="{{ "/" | relative_url }}">{{ site.title }}</a>
        <nav>
          <a href="{{ "/" | relative_url }}">Home</a>
          <!-- add more links if you have pages -->
        </nav>
      </div>
    </header>

    <main>
      {{ content }}
    </main>

    <footer>
      &copy; {{ site.author }} {{ site.time | date: "%Y" }}
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        if (document.querySelector('.swiper')) {
          new Swiper('.swiper', {
            loop: true,
            autoplay: { delay: 4000, disableOnInteraction: false },
            pagination: { el: '.swiper-pagination', clickable: true },
            navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
          });
        }
      });
    </script>
  </body>
</html>
